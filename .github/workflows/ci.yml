name: Native builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      windows_release_tag:
        description: 'Build Setup only from this existing release (for example v1.0.0)'
        type: string
      windows_portable_sha256:
        description: 'SHA-256 of the published Windows portable ZIP'
        type: string

permissions:
  contents: read

jobs:
  native:
    if: github.event_name != 'workflow_dispatch' || inputs.windows_release_tag == ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.93.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Build Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release
          New-Item -ItemType Directory -Path dist
          $versionLine = Select-String -LiteralPath Cargo.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$' -List
          $version = $versionLine.Matches[0].Groups[1].Value
          Compress-Archive -LiteralPath target/release/seyir.exe,README.md,'packaging/windows/Register Open With.cmd','packaging/windows/Remove Open With.cmd' -DestinationPath "dist/Seyir-$version-windows-x64.zip"
      - name: Verify Explorer Open With registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Seyir Görsel'
          New-Item -ItemType Directory -Path $folder | Out-Null
          $exe = Join-Path $folder 'seyir.exe'
          Copy-Item target/release/seyir.exe $exe
          $classes = 'HKCU:\Software\Classes'
          $png = Join-Path $classes '.png'
          $before = (Get-Item -LiteralPath $png -ErrorAction SilentlyContinue)?.GetValue('')
          $program = Join-Path $classes 'Seyir.Image.1'
          $application = Join-Path $classes 'Applications\seyir.exe'
          $associations = Join-Path $png 'OpenWithProgids'
          $command = '"{0}" "%1"' -f $exe
          function Invoke-SeyirRegistration($mode) {
            $process = Start-Process -FilePath $exe -ArgumentList $mode -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Seyir $mode returned $($process.ExitCode)" }
          }
          try {
            Invoke-SeyirRegistration '--register-open-with'
            Invoke-SeyirRegistration '--register-open-with'
            foreach ($handler in @($program, $application)) {
              $actual = (Get-Item -LiteralPath "$handler\shell\open\command").GetValue('')
              if ($actual -cne $command) { throw 'Unexpected Open with command' }
            }
            if ((Get-Item -LiteralPath $associations).GetValueNames() -notcontains 'Seyir.Image.1') {
              throw 'Missing PNG Open with registration'
            }
          } finally {
            Invoke-SeyirRegistration '--unregister-open-with'
          }
          Invoke-SeyirRegistration '--unregister-open-with'
          if ((Test-Path -LiteralPath $program) -or (Test-Path -LiteralPath $application)) {
            throw 'Seyir handler remained registered'
          }
          $remaining = (Get-Item -LiteralPath $associations -ErrorAction SilentlyContinue)?.GetValueNames()
          if ($remaining -contains 'Seyir.Image.1') { throw 'Seyir PNG association remained registered' }
          $after = (Get-Item -LiteralPath $png -ErrorAction SilentlyContinue)?.GetValue('')
          if ($after -cne $before) { throw 'PNG default handler changed' }
      - name: Build and verify Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./packaging/windows/bundle-setup.ps1 -ExecutablePath target/release/seyir.exe -Verify'
      - uses: actions/upload-artifact@v4
        with:
          name: Seyir-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*-Setup.exe
          if-no-files-found: error

  windows-release-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_release_tag != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Setup from the published binary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.windows_release_tag }}
          PORTABLE_SHA256: ${{ inputs.windows_portable_sha256 }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') { throw 'Invalid release tag.' }
          $version = $Matches[1]
          if ($env:PORTABLE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'A portable ZIP SHA-256 is required.' }
          $asset = "Seyir-$version-windows-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $extracted = Join-Path $env:RUNNER_TEMP 'seyir-portable'
          $uri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$asset"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne $env:PORTABLE_SHA256) {
            throw 'The portable ZIP hash does not match the expected release asset.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          & ./packaging/windows/bundle-setup.ps1 -ExecutablePath (Join-Path $extracted 'seyir.exe') -Version $version -Verify
      - uses: actions/upload-artifact@v4
        with:
          name: Seyir-Windows-Setup
          path: dist/*-Setup.exe
          if-no-files-found: error
