name: Native builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.93.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Build Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release
          New-Item -ItemType Directory -Path dist
          Compress-Archive -LiteralPath target/release/seyir.exe,README.md -DestinationPath dist/Seyir-1.0.0-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Seyir-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
